name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write  # attach the zip to a release on v* tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Python reference (x3kc)
        uses: actions/checkout@v4
        with:
          repository: DIMOSUS/x3kc
          path: x3kc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build x86 and x64
        shell: cmd
        run: build.cmd
      - name: Test both builds on synthetic catalogs
        run: python tests/test_wcx.py --x3kc x3kc
      - uses: actions/upload-artifact@v4
        with:
          name: x3wcx
          path: |
            build/x3wcx.wcx
            build/x3wcx.wcx64
            build/x3wcx.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/x3wcx.zip
